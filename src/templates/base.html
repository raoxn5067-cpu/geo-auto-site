<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site_description }}{% endblock %}">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ site_name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ site_description }}{% endblock %}">
  <meta property="og:url" content="{{ canonical_url }}">
  <style>
    :root {
      --bg: #fafafa;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }
    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }
    .site-title:hover { color: var(--accent); }
    main { padding: 2.5rem 0 4rem; }
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
    {% block extra_css %}{% endblock %}
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header>
    <div class="container">
      <a class="site-title" href="{{ base_path }}/">{{ site_name }}</a>
    </div>
  </header>
  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer>
    <div class="container">
      &copy; {{ year }} {{ site_name }} · 每日自动更新
    </div>
  </footer>
</body>
</html>
